<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T2M - 种子转磁力链接</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- 顶栏 -->
    <div class="topbar">
      <div class="logo">T2M</div>
      <div class="auth-area">
        <button id="btnLogin" class="btn-login">登录</button>
        <div id="authUser" class="auth-user">
          <span class="auth-user-name" id="authUsername"></span>
          <button id="btnLogout" class="btn-logout">退出</button>
        </div>
        <div id="loginDropdown" class="login-dropdown">
          <input type="text" id="loginUser" class="login-field" placeholder="用户名" autocomplete="username">
          <input type="password" id="loginPass" class="login-field" placeholder="密码" autocomplete="current-password">
          <div id="loginError" class="login-error"></div>
          <button id="btnSubmitLogin" class="btn-submit-login">登录</button>
        </div>
      </div>
    </div>

    <!-- 拖拽上传区域 -->
    <div id="dropZone" class="drop-zone">
      <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <p class="drop-text">拖拽 .torrent 文件到此处</p>
      <p class="drop-hint">或点击下方按钮选择文件</p>

      <div class="btn-group">
        <button id="btnSelectFiles" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          选择文件
        </button>
        <button id="btnSelectFolder" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          选择文件夹
        </button>
      </div>

      <input type="file" id="fileInput" accept=".torrent" multiple hidden>
      <input type="file" id="folderInput" webkitdirectory hidden>

      <!-- 文件名预览气泡 -->
      <div id="dropPreview" class="drop-preview"></div>

      <!-- 进度条 -->
      <div class="progress-bar">
        <div class="progress-bar-inner"></div>
      </div>

      <div class="filter-option">
        <label class="filter-label">
          <input type="checkbox" id="chkVideoOnly" checked>
          <span>仅显示包含视频的磁力链接</span>
        </label>
      </div>
    </div>

    <!-- 状态提示 -->
    <div id="status" class="status hidden"></div>

    <!-- 过滤摘要 -->
    <div id="filterSummary" class="filter-summary hidden">
      <div class="filter-summary-header"><span id="filterHeaderText"></span></div>
      <div class="exts-row">
        <span class="exts-label">视频后缀：</span>
        <span id="filterVideoExts" class="exts-tags"></span>
      </div>
      <div class="exts-row">
        <span class="exts-label">非视频后缀：</span>
        <span id="filterNonVideoExts" class="exts-tags"></span>
      </div>
      <div id="filterRegexRow" class="filter-summary-regex hidden">
        非视频后缀正则: <code id="filterRegex"></code>
        <button id="btnCopyRegex" class="btn-copy-regex">复制</button>
      </div>
    </div>

    <!-- 历史面板（登录后可见） -->
    <div id="historyPanel" class="history-panel">
      <div class="card">
        <div class="history-panel-header">
          <span class="history-panel-title">转换历史</span>
        </div>
        <input type="text" id="historySearch" class="history-search" placeholder="搜索名称或 info hash...">
        <div class="history-stats">
          <span>总计 <span class="history-stat-value" id="statTotal">0</span></span>
          <span>含视频 <span class="history-stat-value" id="statVideo">0</span></span>
          <span>非视频 <span class="history-stat-value" id="statNonVideo">0</span></span>
        </div>
        <ul id="historyList" class="history-list">
          <li class="history-empty">暂无历史记录</li>
        </ul>
      </div>
    </div>

    <!-- 结果列表 -->
    <div id="results" class="results hidden">
      <div class="results-header">
        <h2 class="results-title">转换结果</h2>
        <button id="btnCopyAll" class="btn btn-copy-all">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          一键复制全部
        </button>
      </div>
      <ul id="resultList" class="result-list"></ul>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
      <p>所有处理均在浏览器本地完成，文件不会上传到服务器</p>
    </footer>
  </div>

  <script src="torrent-parser.js"></script>
  <script src="app.js"></script>
</body>
</html>
